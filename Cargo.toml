[package]
name = "slimsync"
version = "0.1.0"
edition = "2021"
description = "Edge file-sync agent: blind, incremental, encrypted file sync (dual-track AST+CDC slicing, ChaCha20, Blind-ID dedup, offline SQLite ledger, Zenoh transport)"

[dependencies]
# 共享契约
slim-common = { git = "https://github.com/dataxcash/slim-common.git" }

# 异步运行时
tokio = { version = "1", features = ["full", "signal"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 本地账本
rusqlite = { version = "0.31", features = ["bundled"] }

# 文件扫描
walkdir = "2"
jwalk = "0.8"

# 线程间通信
crossbeam-channel = "0.5"

# Linux fanotify (仅 Linux)
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["fanotify"] }
libc = "0.2"

# 内核事件通知
notify = "6"

# 哈希与加密
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"

# Zenoh
zenoh = { version = "1.0.0" }

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# 路径匹配
glob = "0.3"

# 守护进程
daemonize = "0.5"
